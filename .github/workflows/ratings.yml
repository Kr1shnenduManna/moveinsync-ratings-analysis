name: Weekly ratings report

on:
  schedule:
    - cron: "30 3 * * 1"      # every Monday, 03:30 UTC (09:00 IST)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write              # needed so the job can commit the new report

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python ratings_pipeline.py --from-csv

      - name: Commit updated report
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add reviews.csv report.md charts/
          git diff --staged --quiet || git commit -m "Weekly ratings report $(date -u +%F)"
          git push
